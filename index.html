<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antlerdev - An Antler Album</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Georgia, 'Times New Roman', serif; background: #141210; color: #e8e0d4; min-height: 100vh; }
  header { text-align: center; padding: 3rem 1rem 2rem; }
  h1 { font-size: 2.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: #d4b483; }
  header p { margin-top: 0.6rem; color: #9c8f7d; font-style: italic; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 1rem 3rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
  .card { background: #1e1a16; border: 1px solid #33291d; border-radius: 10px; overflow: hidden; }
  .card img { width: 100%; height: 240px; object-fit: cover; display: block; }
  .card figcaption { padding: 0.7rem 0.9rem; font-size: 0.95rem; color: #c9bba6; }
  footer { text-align: center; padding: 1.5rem 1rem 2.5rem; font-size: 0.8rem; color: #7a6f60; }
  footer a { color: #a5906c; }
</style>
</head>
<body>
<header>
  <h1>Antlerdev</h1>
  <p>An album of antlers</p>
</header>
<main>
  <div class="grid">
    <figure class="card">
      <a href="https://commons.wikimedia.org/wiki/File:Antlers_of_a_roe_buck.jpg" target="_blank" rel="noopener"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Antlers_of_a_roe_buck.jpg/960px-Antlers_of_a_roe_buck.jpg" alt="Roe buck antlers" loading="lazy"></a>
      <figcaption>Roe buck antlers</figcaption>
    </figure>
    <figure class="card">
      <a href="https://commons.wikimedia.org/wiki/File:Antler_specimens.jpg" target="_blank" rel="noopener"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Antler_specimens.jpg/960px-Antler_specimens.jpg" alt="Antler specimens" loading="lazy"></a>
      <figcaption>Antler specimens</figcaption>
    </figure>
    <figure class="card">
      <a href="https://commons.wikimedia.org/wiki/File:Antlers_display%2C_Hampton_Court_Palace.jpg" target="_blank" rel="noopener"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Antlers_display%2C_Hampton_Court_Palace.jpg/960px-Antlers_display%2C_Hampton_Court_Palace.jpg" alt="Antler display, Hampton Court Palace" loading="lazy"></a>
      <figcaption>Antler display, Hampton Court Palace</figcaption>
    </figure>
    <figure class="card">
      <a href="https://commons.wikimedia.org/wiki/File:Antlers_and_stairs%2C_Hampton_Court_Palace.jpg" target="_blank" rel="noopener"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Antlers_and_stairs%2C_Hampton_Court_Palace.jpg/960px-Antlers_and_stairs%2C_Hampton_Court_Palace.jpg" alt="Antlers and stairs, Hampton Court Palace" loading="lazy"></a>
      <figcaption>Antlers and stairs, Hampton Court Palace</figcaption>
    </figure>
    <figure class="card">
      <a href="https://commons.wikimedia.org/wiki/File:Barasingha_stag.jpg" target="_blank" rel="noopener"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fe/Barasingha_stag.jpg/960px-Barasingha_stag.jpg" alt="Barasingha stag" loading="lazy"></a>
      <figcaption>Barasingha stag</figcaption>
    </figure>
    <figure class="card">
      <a href="https://commons.wikimedia.org/wiki/File:Brutus_Antlers_Bj%C3%B8rneparken_13.04.2019.jpg" target="_blank" rel="noopener"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/Brutus_Antlers_Bj%C3%B8rneparken_13.04.2019.jpg/960px-Brutus_Antlers_Bj%C3%B8rneparken_13.04.2019.jpg" alt="Brutus' antlers, Bjorneparken" loading="lazy"></a>
      <figcaption>Brutus' antlers, Bjorneparken</figcaption>
    </figure>
    <figure class="card">
      <a href="https://commons.wikimedia.org/wiki/File:Bleached_caribou_antler_curls_around_autumn_bearberry_leaves_%28393adac0-1dd8-b71c-07bd-d4a4460d00b5%29.jpg" target="_blank" rel="noopener"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Bleached_caribou_antler_curls_around_autumn_bearberry_leaves_%28393adac0-1dd8-b71c-07bd-d4a4460d00b5%29.jpg/960px-Bleached_caribou_antler_curls_around_autumn_bearberry_leaves_%28393adac0-1dd8-b71c-07bd-d4a4460d00b5%29.jpg" alt="Bleached caribou antler, autumn tundra" loading="lazy"></a>
      <figcaption>Bleached caribou antler, autumn tundra</figcaption>
    </figure>
    <figure class="card">
      <a href="https://commons.wikimedia.org/wiki/File:Bull_Elk_along_the_Madison_River_%280f1c10c1-43f8-4c86-96bd-0b5aec1ee205%29.jpg" target="_blank" rel="noopener"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/6/61/Bull_Elk_along_the_Madison_River_%280f1c10c1-43f8-4c86-96bd-0b5aec1ee205%29.jpg/960px-Bull_Elk_along_the_Madison_River_%280f1c10c1-43f8-4c86-96bd-0b5aec1ee205%29.jpg" alt="Bull elk along the Madison River" loading="lazy"></a>
      <figcaption>Bull elk along the Madison River</figcaption>
    </figure>
    <figure class="card">
      <a href="https://commons.wikimedia.org/wiki/File:Caribou_antlers_-_Chandler_Lake_-_DPLA_-_f33baf68c8846bbd7658c1f870610ead.jpg" target="_blank" rel="noopener"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Caribou_antlers_-_Chandler_Lake_-_DPLA_-_f33baf68c8846bbd7658c1f870610ead.jpg/960px-Caribou_antlers_-_Chandler_Lake_-_DPLA_-_f33baf68c8846bbd7658c1f870610ead.jpg" alt="Caribou antlers, Chandler Lake" loading="lazy"></a>
      <figcaption>Caribou antlers, Chandler Lake</figcaption>
    </figure>
  </div>
</main>
<footer>
  Photos from <a href="https://commons.wikimedia.org/wiki/Category:Antlers">Wikimedia Commons</a> - click any photo for its source and license. Hosted at antlerdev.duckdns.org.
</footer>
</body>
</html>
